name: Update RSS Archive and Publish Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 6 * * *' # arXiv RSS updates around midnight US Eastern
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Minimum days of submissions to recover (1–120)'
        required: false
        default: '14'

# Serialize runs so that two automated updates do not overwrite one another.
concurrency:
  group: arxiv-archive-and-pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update arXiv archive
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days || '14' }}
        run: python update-archive.py --backfill-days "$BACKFILL_DAYS"

      - name: Commit archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive.json
          if git diff --cached --quiet; then
            echo "No new papers to commit."
          else
            git commit -m "Update arXiv math.RA archive"
            git push
          fi

      - name: Prepare static Pages files
        run: |
          mkdir -p _site
          cp index.html style.css script.js archive.json _site/
          # Keep the site lightweight; Pages should only contain public assets.

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

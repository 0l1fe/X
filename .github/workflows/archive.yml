name: Update RSS Archive

on:
  schedule:
    - cron: '0 10 * * *'  # after arXiv midnight US Eastern, all year
  workflow_dispatch:
    inputs:
      rebuild_since:
        description: 'Optional: rebuild archive from YYYY-MM-DD (e.g. 2026-09-23); leave empty for normal update'
        required: false
        default: ''
      preview_only:
        description: 'Preview without writing archive.json'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: arxiv-archive
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python dependencies
        run: python3 -m pip install beautifulsoup4
      - name: Build or update archive
        env:
          REBUILD_SINCE: ${{ inputs.rebuild_since || '' }}
          PREVIEW_ONLY: ${{ inputs.preview_only || 'false' }}
        run: |
          ARGUMENTS=()
          if [ -n "$REBUILD_SINCE" ]; then ARGUMENTS+=(--rebuild-since "$REBUILD_SINCE"); fi
          if [ "$PREVIEW_ONLY" = "true" ]; then ARGUMENTS+=(--preview); fi
          python3 update-archive.py "${ARGUMENTS[@]}"
      - name: Commit updated archive
        id: saved
        if: ${{ !inputs.preview_only }}
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add archive.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Update math.RA announcements archive'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild existing branch-based GitHub Pages
        if: steps.saved.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

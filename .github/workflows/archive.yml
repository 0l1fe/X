name: Update RSS Archive

on:
  schedule:
    - cron: '0 8 * * *' # After arXiv's midnight Eastern update, even during US standard time
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Normal historical lookback in days (default 14)'
        required: false
        default: '14'
      rebuild_since:
        description: 'OPTIONAL: replace the entire archive with submissions from YYYY-MM-DD onward (e.g. 2026-09-23)'
        required: false
        default: ''

# Commit archive.json and request a rebuild of the existing branch-based Pages site.
permissions:
  contents: write
  pages: write

concurrency:
  group: arxiv-archive
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update archive directly from arXiv
        env:
          BACKFILL_DAYS: ${{ inputs.backfill_days || '14' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          REBUILD_SINCE: ${{ inputs.rebuild_since || '' }}
        run: |
          if [ -n "$REBUILD_SINCE" ]; then
            python3 update-archive.py --rebuild-since "$REBUILD_SINCE"
          elif [ "$MANUAL_RUN" = "true" ]; then
            python3 update-archive.py --backfill-days "$BACKFILL_DAYS" --require-backfill
          else
            python3 update-archive.py --backfill-days "$BACKFILL_DAYS"
          fi

      - name: Commit archive changes only
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add archive.json
          if git diff --cached --quiet; then
            echo 'Archive is unchanged.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated archive update"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN push doesn't automatically trigger GitHub Pages.
      # This asks GitHub to rebuild the existing main/(root) Pages source,
      # *not* upload a redesigned site or change any Pages settings.
      - name: Request Pages rebuild from existing branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
